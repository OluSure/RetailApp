<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <title>Point of Sale - Issue Receipt</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Point of Sale</h1>
      <nav>
        <a href="index.html">Back to Dashboard</a>
      </nav>
    </header>
    <main class="pos-main">
      <section class="pos-left">
        <h2>Add Products to Cart</h2>
        <form id="add-to-cart-form">
          <label for="product-select">Product:</label>
          <select id="product-select" required></select>
          <label for="quantity-input">Quantity:</label>
          <input type="number" id="quantity-input" value="1" min="1" required />
          <button type="submit">Add to Cart</button>
        </form>
      </section>

      <section class="pos-right">
        <h2>Current Cart</h2>
        <div id="cart-items">
          <!-- Cart items will be dynamically inserted here -->
        </div>
        <hr />
        <div id="cart-summary">
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Tax (5%): <span id="tax">$0.00</span></p>
          <h3>Total: <span id="total">$0.00</span></h3>
        </div>
        <button id="checkout-button" disabled>Checkout & Issue Receipt</button>
      </section>
    </main>

    <!-- Receipt Modal -->
    <div id="receipt-modal" class="modal" style="display: none">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Receipt</h2>
        <pre id="receipt-content"></pre>
      </div>
    </div>

    <script src="receipt.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) =>
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope
              )
            )
            .catch((err) =>
              console.log("ServiceWorker registration failed: ", err)
            );
        });
      }
    </script>
  </body>
</html>
